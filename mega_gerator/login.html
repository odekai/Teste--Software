<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" href="login.css">
</head>

<body>
    <div class="main-login">
        <div class="left-login">
            <h1>Mega Gerator</h1>
        </div>
        <div class="rigth-login">
            <div class="card-login">
                <h1>Login</h1>

                <form method="POST">
                    <div class="text-field">
                        <label for="usuario">Usuário</label>
                        <input id="usuario" type="text" name="usuario" placeholder="Digite seu usuário">
                    </div>
                    <div class="text-field">
                        <label for="senha">Senha</label>
                        <input id="senha" type="password" name="senha" placeholder="Digite sua senha">
                    </div>

                    <p class="erro"></p> <!-- MENSAGEM DE ERRO -->

                    <button id="button" class="btn-login" type="submit">Login</button>
                </form>
                <p>Não possui conta? <a href="cadastro.html">Cadastre-se</a></p>


            </div>
        </div>
    </div>
    <script src="login.js"></script>

</body>

</html>
